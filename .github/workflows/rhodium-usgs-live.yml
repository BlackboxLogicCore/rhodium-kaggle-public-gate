name: Rhodium live USGS data integrity
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/rhodium-usgs-live.yml
permissions:
  contents: read
jobs:
  live-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify real USGS event feed and two deterministic streaming replays
        shell: python
        run: |
          import urllib.request, json, hashlib, io, time, zlib
          url = "https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_day.geojson"
          request = urllib.request.Request(url,headers={"User-Agent":"Rhodium-Germany-public-integrity-check/1.0"})
          with urllib.request.urlopen(request,timeout=45) as response:
              raw = response.read(20_000_001)
          assert len(raw) <= 20_000_000, "feed exceeds test limit"
          data = json.loads(raw)
          assert data["type"] == "FeatureCollection"
          assert isinstance(data["features"],list)
          original_sha = hashlib.sha256(raw).hexdigest()
          print(f"SOURCE=USGS_LIVE EVENT_COUNT={len(data['features'])} BYTES={len(raw)} SHA256={original_sha}",flush=True)
          for run in (1,2):
              start=time.perf_counter()
              packed=zlib.compress(raw,6)
              restored_hash=hashlib.sha256()
              restored_size=0
              dec=zlib.decompressobj()
              for offset in range(0,len(packed),4096):
                  out=dec.decompress(packed[offset:offset+4096])
                  restored_hash.update(out)
                  restored_size+=len(out)
              tail=dec.flush()
              restored_hash.update(tail)
              restored_size+=len(tail)
              assert restored_size==len(raw)
              assert restored_hash.hexdigest()==original_sha
              print(f"RUN={run} PASS=true INPUT_BYTES={len(raw)} PACKED_BYTES={len(packed)} RESTORED_BYTES={restored_size} SHA256={restored_hash.hexdigest()} SECONDS={time.perf_counter()-start:.6f}",flush=True)
          altered=bytearray(raw)
          if altered:
              altered[0]^=1
              assert hashlib.sha256(altered).hexdigest()!=original_sha
          print("TAMPER_DETECTION=PASS",flush=True)
          print("SCOPE=public real USGS data, standard-library zlib baseline; not proprietary Rhodium codec or independent product certification",flush=True)
