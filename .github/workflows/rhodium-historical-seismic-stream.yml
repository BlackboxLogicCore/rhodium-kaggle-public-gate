name: Rhodium historical seismic evolution stream
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/rhodium-historical-seismic-stream.yml
permissions:
  contents: read
jobs:
  historical:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Stream twelve months of USGS events and reconstruct spatial-temporal activity
        shell: python
        run: |
          import urllib.request, urllib.parse, json, hashlib, datetime, math, collections
          # Catalog-level retrospective research, not waveform inversion or prediction.
          # 12 consecutive monthly windows, California regional box; no raw-event archive.
          start=datetime.date(2024,10,1)
          months=[(2024+(9+i)//12,(9+i)%12+1) for i in range(13)]
          cells=collections.defaultdict(lambda: [0,0,0,0,0])
          monthly=[]
          allhash=hashlib.sha256()
          total=0
          prev=None
          for i in range(12):
              y,m=months[i]; yn,mn=months[i+1]
              a=f"{y:04d}-{m:02d}-01"; b=f"{yn:04d}-{mn:02d}-01"
              q=urllib.parse.urlencode(dict(format="geojson",starttime=a,endtime=b,minmagnitude=1.0,minlatitude=32,maxlatitude=42,minlongitude=-125,maxlongitude=-114,limit=20000,orderby="time-asc"))
              req=urllib.request.Request("https://earthquake.usgs.gov/fdsnws/event/1/query?"+q,headers={"User-Agent":"Rhodium-historical-seismic-stream/1.0"})
              with urllib.request.urlopen(req,timeout=75) as r:
                  raw=r.read(24000001)
              assert len(raw)<=24000000, "monthly source size limit exceeded"
              features=json.loads(raw)["features"]
              assert len(features)<20000, "month hit event cap; results incomplete"
              allhash.update(hashlib.sha256(raw).digest())
              bucket=[0,0,0,0,0]
              for f in features:
                  p=f["properties"]; lon,lat,depth=f["geometry"]["coordinates"][:3]; mag=p["mag"]
                  if mag is None: continue
                  # Half-degree spatial cells; magnitude bands: <2, 2-3, 3-4, 4-5, >=5.
                  key=(math.floor(lat*2)/2,math.floor(lon*2)/2)
                  band=0 if mag<2 else 1 if mag<3 else 2 if mag<4 else 3 if mag<5 else 4
                  cells[key][band]+=1;bucket[band]+=1
              total+=sum(bucket)
              monthly.append((a,bucket))
              print(f"MONTH={a} EVENTS={sum(bucket)} BANDS={','.join(map(str,bucket))} SHA256={hashlib.sha256(raw).hexdigest()}",flush=True)
              del raw,features
          print(f"TOTAL_EVENTS={total} MONTHS=12 SPATIAL_CELLS={len(cells)} SOURCE_MONTHLY_HASH_CHAIN={allhash.hexdigest()}")
          for key,counts in sorted(cells.items(),key=lambda kv:sum(kv[1]),reverse=True)[:12]:
              print(f"ACTIVE_CELL_LAT={key[0]} LON={key[1]} EVENTS={sum(counts)} BANDS={','.join(map(str,counts))}")
          print("MONTHLY_EVOLUTION="+";".join(a+":"+str(sum(c)) for a,c in monthly))
          print("STREAMING=PASS RAW_EVENT_ARCHIVE=NONE")
          print("SCOPE=12-month USGS catalog evolution; not raw seismic waveforms, causal reconstruction, or earthquake prediction")
